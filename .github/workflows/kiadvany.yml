name: PDF és offline HTML kiadványok
on:
  push:
    branches: [main]
    paths:
      - 'elmelet/**'
      - 'matlab/peldatar/MEGOLDASOK_*.md'
      - 'kiadvany/build.py'
      - 'kiadvany/print.css'
      - '.github/workflows/kiadvany.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiadvany-main
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          pip install weasyprint markdown-it-py
      - name: Build PDF and HTML
        run: python kiadvany/build.py
      - name: Commit generated publications to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kiadvany/*.html kiadvany/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "build: frissített PDF és HTML tananyag"
            git push origin HEAD:main
          fi
