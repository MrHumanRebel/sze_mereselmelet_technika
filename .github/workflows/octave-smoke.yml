name: MATLAB algorithm smoke tests (Octave compatibility)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  octave-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y octave
      - name: Run core, extended and available original-data tests
        run: |
          octave --no-gui --quiet --eval "cd('matlab'); run_tests; run_extended_tests; run_source_data_tests;"
# Az Octave-siker nem helyettesíti a hivatalos MATLAB laborban végzett futtatást.
