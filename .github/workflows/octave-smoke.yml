name: MATLAB algorithm smoke tests (Octave compatibility)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  octave-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y octave
      - name: Run MATLAB core and extended tests
        run: |
          octave --no-gui --quiet --eval "cd('matlab'); run_tests; run_extended_tests;"
# CAUTION: Octave success != MATLAB success. A valid licensed MATLAB test is still required.
